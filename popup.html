<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>红薯收藏夹</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">
          <span></span><span></span>
        </div>
        <div>
          <h1>红薯收藏夹</h1>
        </div>
        <button id="refreshButton" class="icon-button" type="button" aria-label="重新读取">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5M18.2 9A7 7 0 0 0 6.7 6.7L4 9m16 6-2.7 2.3A7 7 0 0 1 5.8 15"/></svg>
        </button>
      <button id="historyButton" class="quiet-button" type="button">记录</button></header>
      <section id="historyPane" class="history-pane hidden"><div class="pane-heading"><h2>保存记录</h2><button id="clearHistoryButton" class="quiet-button">清除</button></div><p class="muted">最近 100 次成功保存，仅保存在此设备</p><div id="historyList" class="history-list"></div></section>
      <div class="content" id="contentPane">
      <section id="loadingState" class="state-card loading-state" aria-live="polite">
        <div class="loader"><i></i><i></i><i></i></div>
        <h2>正在寻找图片</h2>
        <p>稍等一下，正在读取当前笔记…</p>
      </section>

      <section id="emptyState" class="state-card hidden" aria-live="polite">
        <div class="state-illustration">⌁</div>
        <h2 id="emptyTitle">这里还没有图片</h2>
        <p id="emptyMessage">请打开一篇小红书图文笔记，再点一次扩展。</p>
        <button id="retryButton" class="secondary-button" type="button">重新读取</button>
      </section>

      <section id="galleryState" class="gallery hidden">
        <div class="note-info">
          <p id="noteTitle" class="note-title">当前笔记</p>
          <p id="duplicateHint" class="duplicate-hint hidden"></p>
          <div class="selection-row">
            <span id="imageCount">找到 0 张图片</span>
            <button id="toggleAllButton" type="button">取消全选</button>
          </div>
        </div>
        <div id="imageGrid" class="image-grid"></div>
      </section>

      </div>
      <footer id="actionBar" class="action-bar hidden">
        <button id="changeTargetButton" class="target-summary"><span id="targetSummary">照片 · 图库</span><span>更改 ›</span></button>
        <p id="resultMessage" class="result-message hidden" role="status" aria-live="polite"></p>
        <button id="detailsButton" class="quiet-button hidden">查看详情</button>
        <progress id="taskProgress" class="hidden" max="100" value="0"></progress>
        <button id="retryFailedButton" class="target-button hidden" type="button">重试失败项</button>
        <button id="stopButton" class="target-button hidden" type="button">停止任务</button>
        <button id="saveButton" class="save-button" type="button">
          <span id="saveButtonLabel">导入照片</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 5-5m-5 5-5-5M5 19h14"/></svg>
        </button>
      </footer>

      <dialog id="targetDialog" class="target-dialog" aria-label="保存位置"><div class="pane-heading"><h2>保存到哪里</h2><button id="closeTargetButton" class="quiet-button" aria-label="关闭保存位置">✕</button></div>
        <div class="destination-settings">
          <div class="destination-tabs"><button id="photosTargetButton" type="button">macOS 照片</button><button id="folderTargetButton" type="button">本地文件夹</button></div><label class="hidden" for="destinationSelect">保存到</label>
          <select id="destinationSelect" class="hidden">
            <option value="photos">macOS“照片”</option>
            <option value="folder">本地文件夹</option>
          </select>
          <div id="albumSettings" class="target-settings">
            <label for="albumSelect">目标相簿</label>
            <select id="albumSelect"><option value="">图库（不指定相簿）</option></select>
            <button id="loadAlbumsButton" class="target-button" type="button">读取相簿</button>
          </div>
          <div id="folderSettings" class="target-settings hidden">
            <button id="chooseFolderButton" class="target-button" type="button">选择文件夹…</button>
            <span id="folderPath" class="folder-path">尚未选择文件夹</span>
          </div>
          <p id="destinationHint" class="destination-hint">原图、GIF、实况 · 可同步 iCloud</p>
        </div>
<button id="confirmTargetButton" class="save-button">使用这个位置</button></dialog>
      <dialog id="previewDialog" class="preview-dialog" aria-label="图片静态预览"><div class="pane-heading"><button id="closePreviewButton" class="quiet-button">返回</button><span id="previewLabel"></span></div><img id="previewImage" alt="图片静态预览"><div class="preview-actions"><button id="previousImageButton">上一张</button><button id="previewSelectButton">选择本张</button><button id="nextImageButton">下一张</button></div><p class="muted">查看静态预览</p></dialog>
      <dialog id="detailsDialog" aria-labelledby="detailTitle"><div class="pane-heading"><h2 id="detailTitle">保存详情</h2><button id="closeDetailsButton" class="quiet-button">关闭</button></div><p id="detailText"></p><a id="sourceLink" class="hidden" target="_blank" rel="noopener noreferrer">打开原笔记 ↗</a></dialog>
      <dialog id="clearDialog" aria-label="清除保存记录确认"><h2>清除保存记录？</h2><p class="muted">只清除此设备上的记录，已保存的照片和文件会保留。</p><div class="preview-actions"><button id="cancelClearButton">取消</button><button id="confirmClearButton">清除记录</button></div></dialog>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
