<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    width:1280px;height:640px;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Segoe UI",sans-serif;
    color:#1c1b22;-webkit-font-smoothing:antialiased;
    background:linear-gradient(122deg,#fff5f7 0%,#fdf7ff 46%,#f2f4ff 100%);
  }
  .stage{position:relative;width:1280px;height:640px;display:flex;align-items:center;padding:0 72px}

  /* soft colour blooms */
  .bloom{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;pointer-events:none}
  .b1{width:520px;height:520px;background:#ff5c78;top:-190px;left:-140px}
  .b2{width:460px;height:460px;background:#8a4de0;bottom:-210px;left:210px;opacity:.34}
  .b3{width:380px;height:380px;background:#3b8ef5;top:-90px;right:-120px;opacity:.28}

  .left{position:relative;flex:1;padding-right:34px}

  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:14.5px;font-weight:600;letter-spacing:.4px;color:#d92a4c;
    background:#fff;border:1px solid #ffd3dc;border-radius:999px;
    padding:7px 16px;margin-bottom:26px;
    box-shadow:0 2px 10px -4px rgba(217,42,76,.3);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:#ff2442;box-shadow:0 0 0 3px #ffe0e6}

  h1{font-size:74px;font-weight:800;letter-spacing:-2.4px;line-height:1;margin-bottom:20px}
  h1 .accent{
    background:linear-gradient(96deg,#ff2442 0%,#e0399b 52%,#8a4de0 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

  .lead{font-size:25px;font-weight:600;color:#3a3846;letter-spacing:-.2px;margin-bottom:12px}
  .lead em{font-style:normal;color:#1c1b22;background:linear-gradient(transparent 62%,#ffd9e1 62%)}

  .en{font-size:15.5px;color:#6b6a76;line-height:1.55;max-width:560px;margin-bottom:30px}

  .url{
    display:inline-flex;align-items:center;gap:9px;
    font-size:14px;color:#5a5867;font-weight:500;
    background:rgba(255,255,255,.82);border:1px solid #e6e3ee;
    border-radius:10px;padding:9px 15px;backdrop-filter:blur(6px);
  }
  .url svg{width:15px;height:15px;fill:#8b8899}

  /* ---------- right visual ---------- */
  .right{position:relative;width:452px;flex:none;display:flex;align-items:center;justify-content:center;gap:0}

  .deck{position:relative;width:186px;height:246px;flex:none}
  .card{
    position:absolute;inset:0;border-radius:20px;border:1px solid rgba(255,255,255,.9);
    box-shadow:0 12px 30px -12px rgba(28,27,34,.34);
  }
  .c1{transform:rotate(-11deg) translate(-30px,10px);background:linear-gradient(150deg,#ffcfd9,#ff8fa6)}
  .c2{transform:rotate(-5deg) translate(-12px,4px);background:linear-gradient(150deg,#e0c4ff,#b27cf0)}
  .c3{
    background:#fff;transform:rotate(2deg);overflow:hidden;
    display:flex;flex-direction:column;
  }
  .c3 .bars{padding:12px 12px 0}
  .c3 .bars i{display:block;height:9px;border-radius:5px;background:#efeef3;margin-bottom:7px}
  .c3 .bars i:first-child{width:64%;background:linear-gradient(90deg,#ffd0d9,#ffb3c2)}
  .c3 .bars i:last-child{width:38%;margin-bottom:0}
  .c3 .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:12px}
  .c3 .grid span{
    aspect-ratio:1;border-radius:9px;
    background:linear-gradient(140deg,#ffe3e9,#f0dcff);
  }
  .c3 .grid span:nth-child(2){background:linear-gradient(140deg,#dde8ff,#e6dcff)}
  .c3 .grid span:nth-child(4){background:linear-gradient(140deg,#ffeede,#ffd9e6)}

  .arrow{width:52px;flex:none;display:flex;align-items:center;justify-content:center}
  .arrow svg{width:34px;height:34px}
  .arrow path{stroke:#b9b6c6;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}

  .photo{
    position:relative;width:186px;height:246px;flex:none;border-radius:20px;
    background:linear-gradient(158deg,#ff4d6d 0%,#c13ba8 48%,#6f4de0 100%);
    box-shadow:0 18px 40px -14px rgba(150,40,160,.55);
    display:flex;flex-direction:column;justify-content:space-between;padding:16px;
  }
  .photo .live{
    align-self:flex-start;display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.94);color:#c81f56;
    font-size:12px;font-weight:800;letter-spacing:.8px;
    padding:6px 12px;border-radius:999px;
  }
  .photo .live b{width:6px;height:6px;border-radius:50%;background:#ff2442;display:block}
  .photo .meta{color:#fff}
  .photo .meta .t{font-size:19px;font-weight:700;letter-spacing:-.3px}
  .photo .meta .s{font-size:12.5px;opacity:.85;margin-top:4px}
  .photo .ring{
    position:absolute;inset:0;border-radius:20px;
    border:1.5px solid rgba(255,255,255,.34);
  }
</style>
</head>
<body>
<div class="stage">
  <span class="bloom b1"></span><span class="bloom b2"></span><span class="bloom b3"></span>

  <div class="left">
    <span class="eyebrow"><span class="dot"></span>Chrome 扩展 · macOS</span>

    <h1>红薯<span class="accent">收藏夹</span></h1>

    <p class="lead">小红书<em>原图 · GIF · 实况照片</em>，直接存进「照片」App</p>

    <p class="en">Save Xiaohongshu (RedNote) originals, GIFs and Live Photos<br>straight into macOS Photos — then sync to iPhone over iCloud.</p>

    <span class="url">
      <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      FlyTOmeLight/xiaohongshu-to-photos
    </span>
  </div>

  <div class="right">
    <div class="deck">
      <span class="card c1"></span>
      <span class="card c2"></span>
      <span class="card c3">
        <span class="bars"><i></i><i></i></span>
        <span class="grid"><span></span><span></span><span></span><span></span></span>
      </span>
    </div>

    <div class="arrow">
      <svg viewBox="0 0 34 34">
        <path d="M5 17h22M20 9.5l7.5 7.5-7.5 7.5"/>
      </svg>
    </div>

    <div class="photo">
      <span class="ring"></span>
      <span class="live"><b></b>LIVE</span>
      <span class="meta">
        <span class="t">已导入「照片」</span>
        <span class="s">iCloud 同步到 iPhone</span>
      </span>
    </div>
  </div>
</div>
</body>
</html>
